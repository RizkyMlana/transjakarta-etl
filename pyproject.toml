[project]
name = "transjakarta-etl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RizkyMlana", email = "rizkyzky345@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.1.4",
]

[project.scripts]
transjakarta-etl = "transjakarta_etl:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
